<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js?v=ios-keyboard-2"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
</helmet>
<div style="display:inline-block;position:relative;max-width:100%;padding:14px 20px;font-size:13.5px;line-height:1.68;border-radius:24px;text-align:left;font-family:'Noto Serif SC',serif;align-self:{{ selfAlign }};color:{{ txt }};background:{{ bg }}">{{ body }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:150},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;医修绿&quot;,&quot;剑契红&quot;,&quot;机关紫&quot;,&quot;师妹金&quot;,&quot;师尊青&quot;],&quot;default&quot;:&quot;医修绿&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;align&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;左&quot;,&quot;右&quot;],&quot;default&quot;:&quot;左&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;小师妹，我新得了一株《九转还魂草》。你那假丹方，要不要换些真材料？&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;（柔声）&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;textColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    // 五个门派配色：[渐变RGB, 文字色]
    const tones = {
      '医修绿': ['70,120,98', '#1f4636'],
      '剑契红': ['160,66,72', '#5a2326'],
      '机关紫': ['104,86,150', '#3a2f52'],
      '师妹金': ['168,128,58', '#4a3a14'],
      '师尊青': ['60,84,110', '#22303a'],
    };
    const t = tones[this.props.tone] || tones['医修绿'];
    // tint 可传 "R,G,B" 覆盖预设，便于任意配色复用
    const rgb = (this.props.tint && this.props.tint.trim()) || t[0];
    const txt = (this.props.textColor && this.props.textColor.trim()) || t[1];
    // 水墨晕染气泡：4 层散点墨晕 + 1 层中心实、边缘渐隐到透明的底色
    const g = (pos, end, a) => `radial-gradient(${pos},rgba(${rgb},${a}) 0%,transparent ${end})`;
    const bg = [
      g('58% 82% at 28% 38%', '68%', '.20'),
      g('46% 70% at 72% 64%', '70%', '.20'),
      g('40% 60% at 55% 30%', '66%', '.18'),
      g('92% 122% at 50% 55%', '74%', '.10'),
      `radial-gradient(120% 132% at 50% 45%,rgba(${rgb},.13) 0%,rgba(${rgb},.04) 36%,transparent 60%)`,
    ].join(',');
    // props.default 只填充编辑器，运行时为 undefined —— 独立预览用示例兜底
    const text = this.props.text ?? '小师妹，我新得了一株《九转还魂草》。你那假丹方，要不要换些真材料？';
    const note = this.props.note ?? '（柔声）';
    // 优先渲染传入的富文本子节点（含高亮书名号、旁白等）；无子节点时回退到 text + note
    const kids = this.props.children;
    const hasKids = kids != null && !(Array.isArray(kids) && kids.length === 0);
    const body = hasKids
      ? kids
      : [text, note && note.trim() ? React.createElement('span', {key:'n', style:{color:'#a39a8b'}}, note) : null];
    return {
      bg, txt,
      body,
      selfAlign: (this.props.align || '左') === '右' ? 'flex-end' : 'flex-start',
    };
  }
}
</script>
</body>
</html>
