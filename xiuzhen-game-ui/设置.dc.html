<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="./support.js?v=ios-keyboard-2"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;padding:0;height:var(--app-height,100vh);overflow:hidden;background:#16140f}
  body{font-family:'Noto Serif SC','PingFang SC',-apple-system,BlinkMacSystemFont,serif;background:#16140f}
  ::-webkit-scrollbar{width:0;height:0}
  input{font-family:inherit}
  input::placeholder{color:#a59c8b;opacity:1}
  @keyframes saveRise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
  @keyframes sealPop{0%{opacity:0;transform:scale(.35) rotate(-14deg)}55%{opacity:1;transform:scale(1.12) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes inkDraw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
  @keyframes inkWipe{from{clip-path:inset(0 100% 0 0);opacity:.45}to{clip-path:inset(0 0 0 0);opacity:1}}
</style>
</helmet>

<div style="position:relative;width:100%;min-height:var(--app-height,100vh);display:flex;justify-content:center;background:#16140f">
<div style="position:relative;width:100%;max-width:440px;height:var(--app-height,100vh);display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(140% 72% at 50% -8%,#fcf9f3 0%,#f4efe4 50%,#ece4d3 100%);box-shadow:0 0 50px rgba(0,0,0,.45);--disp:{{ dispFont }}" ref="{{ frameRef }}">

  <!-- ===== 背景水墨大图（随分区四实时切换） ===== -->
  <div style="position:absolute;inset:0;z-index:0;pointer-events:none;background-image:url({{ bgUrl }});background-size:cover;background-position:top center;background-repeat:no-repeat;opacity:{{ bgDim }}"></div>
  <div style="position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(250,246,238,.04) 0%,rgba(250,246,238,.32) 32%,rgba(250,246,238,.44) 66%,rgba(250,246,238,.7) 100%)"></div>

  <!-- ===== 顶栏 ===== -->
  <div style="position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:16px 16px 11px;border-bottom:1px solid rgba(70,62,48,.14)">
    <div style="display:flex;align-items:center;gap:11px">
      <div style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin-left:-5px;cursor:pointer;transition:transform .15s,opacity .15s" style-active="transform:scale(.88)" style-hover="opacity:.62"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2b2924" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="6" y2="12"></line><polyline points="11 7 6 12 11 17"></polyline></svg></div>
      <span style="font-family:var(--disp);font-size:25px;color:#2b2924;letter-spacing:4px;line-height:1">设置</span>
    </div>
    
  </div>

  <!-- ===== 滚动内容 ===== -->
  <div style="position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;padding:22px 18px 32px;display:flex;flex-direction:column;gap:32px">

    <!-- ===== 分区一 · 表情包库 ===== -->
    <div>
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:13px">
        <div style="flex:0 0 auto;width:46px;height:46px;background:url(assets/brush/enso-red.png) center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center"><span style="position:relative;font-family:var(--disp);font-size:15px;color:#2b2924;transform:translate(-3.5px,-3.5px)">一</span></div>
        <span style="font-family:var(--disp);font-size:20px;color:#2b2924;letter-spacing:2px;white-space:nowrap">灵符 · 表情包</span>
        <div style="flex:1;height:1px;background:linear-gradient(90deg,rgba(70,62,48,.3),rgba(70,62,48,0))"></div>
        <span style="font-size:11px;color:#a59c8b;letter-spacing:1px;white-space:nowrap">长按拖至垃圾桶</span>
      </div>

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:11px">
        <sc-for list="{{ stickers }}" as="st" hint-placeholder-count="7">
          <div onMouseDown="{{ st.onPressStart }}" onTouchStart="{{ st.onPressStart }}" style="position:relative;aspect-ratio:1;border:1px solid rgba(70,62,48,.22);border-radius:11px;background:repeating-linear-gradient(45deg,rgba(70,62,48,.055) 0 7px,rgba(252,249,243,.2) 7px 14px),rgba(252,249,243,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;opacity:{{ st.op }};transition:opacity .15s,transform .15s">
            <div style="width:23px;height:23px;border-radius:50%;border:1px dashed rgba(70,62,48,.32);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:13px;color:#9a917f">符</div>
            <span style="font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#7a7263;letter-spacing:.2px;text-align:center;line-height:1.25;padding:0 3px">{{ st.label }}</span>
          </div>
        </sc-for>
        <div onClick="{{ onAddSticker }}" style="aspect-ratio:1;border:1.4px dashed rgba(70,62,48,.36);border-radius:11px;background:rgba(252,249,243,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:#7a7263" style-active="transform:scale(.96)">
          <span style="font-size:23px;line-height:1;margin-top:-2px">＋</span>
          <span style="font-size:11px;letter-spacing:1px">添加</span>
        </div>
      </div>
      <div style="font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:#a59c8b;margin-top:10px;letter-spacing:.2px">// 条纹格为占位 — 拖入表情图即替换</div>
    </div>

    <!-- ===== 分区二 · 群成员备注 ===== -->
    <div>
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:6px">
        <div style="flex:0 0 auto;width:46px;height:46px;background:url(assets/brush/enso-red.png) center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center"><span style="position:relative;font-family:var(--disp);font-size:15px;color:#2b2924;transform:translate(-3.5px,-3.5px)">二</span></div>
        <span style="font-family:var(--disp);font-size:20px;color:#2b2924;letter-spacing:2px;white-space:nowrap">道友 · 备注</span>
        <div style="flex:1;height:1px;background:linear-gradient(90deg,rgba(70,62,48,.3),rgba(70,62,48,0))"></div>
        <span style="font-size:11px;color:#a59c8b;letter-spacing:1px;white-space:nowrap">题字以记</span>
      </div>

      <div style="display:flex;flex-direction:column">
        <sc-for list="{{ remarkMembers }}" as="m" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid rgba(70,62,48,.1)">
            <div style="flex:0 0 42px;width:42px;height:42px;border-radius:50%;background:{{ m.grad }};border:1px solid rgba(70,62,48,.3);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:24px;color:{{ m.color }};box-shadow:0 1px 2px rgba(40,30,15,.1)">{{ m.key }}</div>
            <span style="flex:0 0 72px;font-size:14px;font-weight:600;color:#3a352d;white-space:nowrap">{{ m.name }}</span>
            <div style="flex:1;display:flex;align-items:center;gap:7px;border-bottom:1px solid rgba(70,62,48,.24);padding-bottom:4px">
              <input value="{{ m.remark }}" onChange="{{ m.onRemark }}" placeholder="{{ m.placeholder }}" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px;color:#2b2924;font-family:var(--disp);letter-spacing:1px;padding:0">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#b3a994" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 L18.5 5.5"></path><path d="M14.5 5.5 L18.5 9.5"></path><path d="M5 19 L9.2 18"></path></svg>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- ===== 分区三 · 群成员头像 ===== -->
    <div>
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:14px">
        <div style="flex:0 0 auto;width:46px;height:46px;background:url(assets/brush/enso-red.png) center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center"><span style="position:relative;font-family:var(--disp);font-size:15px;color:#2b2924;transform:translate(-3.5px,-3.5px)">三</span></div>
        <span style="font-family:var(--disp);font-size:20px;color:#2b2924;letter-spacing:2px;white-space:nowrap">道友 · 头像</span>
        <div style="flex:1;height:1px;background:linear-gradient(90deg,rgba(70,62,48,.3),rgba(70,62,48,0))"></div>
        <span style="font-size:11px;color:#a59c8b;letter-spacing:1px;white-space:nowrap">轻点裁切</span>
      </div>

      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:7px">
        <sc-for list="{{ avatarMembers }}" as="m" hint-placeholder-count="6">
          <div onClick="{{ m.onPick }}" style="display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer" style-active="transform:scale(.95)">
            <div style="position:relative;width:100%;aspect-ratio:1">
              <div style="position:absolute;inset:0;border-radius:{{ cropRadius }};overflow:hidden;border:1px solid rgba(70,62,48,.3);background:{{ m.grad }};box-shadow:0 1px 3px rgba(40,30,15,.14)">
                <sc-if value="{{ m.hasImg }}" hint-placeholder-val="{{ false }}"><div style="width:100%;height:100%;background-image:url({{ m.src }});background-size:cover;background-position:{{ m.px }}% {{ m.py }}%;transform:scale({{ m.scale }})"></div></sc-if>
                <sc-if value="{{ m.noImg }}"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:25px;color:{{ m.color }}">{{ m.key }}</div></sc-if>
              </div>
              <div style="position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;background:{{ sealBg }};border:1.5px solid #f6f1e6;display:flex;align-items:center;justify-content:center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#f4ecdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.6 H6.4 L7.7 6.6 H16.3 L17.6 8.6 H21 V19 H3 Z"></path><circle cx="12" cy="13.1" r="3.1"></circle></svg></div>
            </div>
            <span style="font-size:10.5px;color:#6b655a;white-space:nowrap;letter-spacing:.3px">{{ m.name }}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- ===== 分区四 · 页面背景 ===== -->
    <div>
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:15px">
        <div style="flex:0 0 auto;width:46px;height:46px;background:url(assets/brush/enso-red.png) center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center"><span style="position:relative;font-family:var(--disp);font-size:15px;color:#2b2924;transform:translate(-3.5px,-3.5px)">四</span></div>
        <span style="font-family:var(--disp);font-size:20px;color:#2b2924;letter-spacing:2px;white-space:nowrap">山水 · 背景</span>
        <div style="flex:1;height:1px;background:linear-gradient(90deg,rgba(70,62,48,.3),rgba(70,62,48,0))"></div>
        
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <sc-for list="{{ bgOptions }}" as="b" hint-placeholder-count="2">
          <div onClick="{{ b.onSelect }}" style="cursor:pointer;display:flex;flex-direction:column;gap:9px" style-active="transform:scale(.98)">
            <div style="position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background-image:url({{ b.url }});background-size:cover;background-position:top center;box-shadow:0 2px 9px rgba(40,30,15,.18)">
              <div style="position:absolute;inset:0;border-radius:10px;border:1px solid rgba(70,62,48,.22)"></div>
              <sc-if value="{{ b.selected }}">
                <div style="position:absolute;inset:0;border-radius:10px;border:2.5px solid {{ sealBg }}"></div>
                <div style="position:absolute;top:8px;right:8px;width:27px;height:27px;border-radius:6px;background:{{ sealBg }};display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(40,30,15,.32)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f4ecdc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12.5 10 17.5 19 7"></polyline></svg></div>
              </sc-if>
            </div>
            <div style="display:flex;flex-direction:column;gap:1px;align-items:center">
              <span style="font-family:var(--disp);font-size:16px;color:#2b2924;letter-spacing:2px">{{ b.label }}</span>
              <span style="font-size:11px;color:#8a8273;letter-spacing:1px">{{ b.sub }}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- ===== 收存 ===== -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:11px;margin-top:2px">
      <div onClick="{{ onSave }}" style="display:flex;align-items:center;gap:8px;padding:8px 22px;border-radius:18px;border:1.2px solid rgba(70,62,48,.42);background:rgba(252,249,243,.55);cursor:pointer;box-shadow:0 1px 3px rgba(40,30,15,.1);transition:transform .16s cubic-bezier(.34,1.4,.64,1),box-shadow .2s,background .2s" style-active="transform:scale(.96);box-shadow:0 1px 2px rgba(40,30,15,.08);background:rgba(248,243,233,.7)">
        <span style="font-family:var(--disp);font-size:15px;color:#2b2924;letter-spacing:3px">保存</span>
      </div>
      <sc-if value="{{ savedA }}"><span style="display:inline-flex;align-items:center;gap:7px;font-size:12px;color:{{ sealBg }};letter-spacing:2px;animation:saveRise .42s cubic-bezier(.33,1,.68,1) both"><span style="display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:5px;background:{{ sealBg }};color:#faf6ee;font-size:10px;line-height:1;animation:sealPop .52s cubic-bezier(.34,1.56,.64,1) both">✓</span>已收入袖中</span></sc-if>
      <sc-if value="{{ savedB }}"><span style="display:inline-flex;align-items:center;gap:7px;font-size:12px;color:{{ sealBg }};letter-spacing:2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ sealBg }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12.5 10 17.5 19 7" style="stroke-dasharray:30;animation:inkDraw .5s cubic-bezier(.65,0,.35,1) both"></polyline></svg><span style="display:inline-block;animation:inkWipe .55s cubic-bezier(.5,0,.2,1) both">已收入袖中</span></span></sc-if>
    </div>

  </div>

  <!-- ===== 拖拽删除：浮动表情 + 底部垃圾桶 ===== -->
  <sc-if value="{{ dragActive }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;bottom:0;z-index:55;height:210px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:30px;pointer-events:none;background:{{ trashWash }};transition:background .25s ease">
      <svg width="{{ trashSize }}" height="{{ trashSize }}" viewBox="0 0 24 24" fill="none" stroke="{{ trashIcon }}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="transition:all .2s ease;filter:drop-shadow(0 3px 9px rgba(130,24,12,.45))"><path d="M4 7 H20"></path><path d="M9 7 V5 H15 V7"></path><path d="M6.5 7 L7.4 20 H16.6 L17.5 7"></path><path d="M10 11 V16 M14 11 V16"></path></svg>
      <span style="margin-top:9px;font-family:var(--disp);font-size:13px;letter-spacing:4px;color:{{ trashIcon }};transition:color .2s ease">{{ trashLabel }}</span>
    </div>
    <div style="position:absolute;z-index:60;pointer-events:none;left:{{ dragX }}px;top:{{ dragY }}px;width:64px;height:64px;margin-left:-32px;margin-top:-32px;border:1px solid rgba(70,62,48,.3);border-radius:12px;background:repeating-linear-gradient(45deg,rgba(70,62,48,.06) 0 7px,rgba(252,249,243,.55) 7px 14px),#f4efe4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 10px 24px rgba(20,18,14,.42);transform:rotate(-5deg) scale(1.05)">
      <div style="width:22px;height:22px;border-radius:50%;border:1px dashed rgba(70,62,48,.32);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:13px;color:#9a917f">符</div>
      <span style="font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#7a7263">{{ dragLabel }}</span>
    </div>
  </sc-if>

  <!-- ===== 头像裁切页（覆盖层） ===== -->
  <sc-if value="{{ cropOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;background:linear-gradient(180deg,#1d1b15,#2c2822)">
      <div style="position:absolute;inset:0;background-image:url(assets/bg/landscape-1.png);background-size:cover;background-position:center;opacity:.1;pointer-events:none"></div>

      <div style="position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px">
        <span onClick="{{ onCropCancel }}" style="font-size:14px;color:#cdbfa6;letter-spacing:2px;cursor:pointer">取消</span>
        <span style="font-family:var(--disp);font-size:21px;letter-spacing:3px;color:#f4ecdc">裁切头像</span>
        <span onClick="{{ onCropConfirm }}" style="font-size:14px;color:#e8c98a;letter-spacing:2px;cursor:pointer">确认</span>
      </div>
      <span style="position:relative;z-index:2;text-align:center;font-size:11px;color:#9a9080;letter-spacing:1px;margin-bottom:8px">为「{{ cropMember }}」题写新颜 · 拖动取景，缩放定格</span>

      <div style="position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center">
        <div onMouseDown="{{ onCropDown }}" onTouchStart="{{ onCropDown }}" style="position:relative;width:300px;height:300px;touch-action:none;cursor:grab;overflow:hidden;border-radius:14px">
          <div style="position:absolute;inset:0;background-image:url({{ cropSrc }});background-size:cover;background-position:{{ cropPx }}% {{ cropPy }}%;transform:scale({{ cropScale }});pointer-events:none"></div>
          <div style="position:absolute;inset:0;box-shadow:0 0 0 600px rgba(20,18,14,.64);border-radius:{{ cropRadius }};pointer-events:none"></div>
          <div style="position:absolute;inset:0;border-radius:{{ cropRadius }};border:1.5px solid rgba(244,236,220,.85);pointer-events:none"></div>
          <div style="position:absolute;inset:0;border-radius:{{ cropRadius }};overflow:hidden;pointer-events:none">
            <div style="position:absolute;left:33.33%;top:0;bottom:0;width:1px;background:rgba(244,236,220,.22)"></div>
            <div style="position:absolute;left:66.66%;top:0;bottom:0;width:1px;background:rgba(244,236,220,.22)"></div>
            <div style="position:absolute;top:33.33%;left:0;right:0;height:1px;background:rgba(244,236,220,.22)"></div>
            <div style="position:absolute;top:66.66%;left:0;right:0;height:1px;background:rgba(244,236,220,.22)"></div>
          </div>
        </div>
      </div>

      <div style="position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:16px 30px 6px;color:#cdbfa6">
        <span style="font-family:var(--disp);font-size:15px">小</span>
        <input type="range" min="1" max="2.6" step="0.01" value="{{ cropScale }}" onChange="{{ onZoom }}" style="flex:1;accent-color:#c9a86a;height:2px">
        <span style="font-family:var(--disp);font-size:22px">大</span>
      </div>

      <div style="position:relative;z-index:2;padding:8px 28px 28px;display:flex;justify-content:center">
        <div onClick="{{ onCropConfirm }}" style="padding:12px 46px;border-radius:26px;background:linear-gradient(180deg,#caa86a,#a9802f);color:#1c1a15;font-family:var(--disp);font-size:18px;letter-spacing:5px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.42)" style-active="transform:translateY(1px)">定 格</div>
      </div>
    </div>
  </sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:900},&quot;fontScheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;思源宋·端方&quot;,&quot;思源黑·素雅&quot;,&quot;仿宋·清峻&quot;,&quot;鸿雷行书·潇洒&quot;],&quot;default&quot;:&quot;思源宋·端方&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;saveAnim&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;墨章·印&quot;,&quot;笔锋·掠&quot;],&quot;default&quot;:&quot;墨章·印&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cropShape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;圆形&quot;,&quot;方形&quot;,&quot;圆角&quot;],&quot;default&quot;:&quot;圆形&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sealColor&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;朱砂红&quot;,&quot;松烟墨&quot;,&quot;石青&quot;],&quot;default&quot;:&quot;朱砂红&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bgDim&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  membersBase = [
    { key: '兄', name: '温润师兄', tag: '外门·医修', grad: 'linear-gradient(160deg,#e9e1d0,#d6cbb3)', color: '#4a443a' },
    { key: '剑', name: '本命剑灵', tag: '本命剑契', grad: 'linear-gradient(160deg,#ecdcd9,#d9b9b3)', color: '#7a3b3f' },
    { key: '姐', name: '寡言师姐', tag: '墨家·机关', grad: 'linear-gradient(160deg,#e4e0ea,#c8c0d6)', color: '#5b517a' },
    { key: '尊', name: '清冷师尊', tag: '清虚峰·主', grad: 'linear-gradient(160deg,#dee2ec,#bcc3d8)', color: '#43507a' },
    { key: '侠', name: '不羁游侠', tag: '江湖·散修', grad: 'linear-gradient(160deg,#ece0cf,#dcc6a8)', color: '#9a6a3a' },
    { key: '我', name: '小师妹', tag: '外门·三阶', grad: 'linear-gradient(160deg,#dde9df,#bcd6c4)', color: '#36634c', self: true },
  ];

  state = {
    stickers: [
      { id: 's1', label: '作揖' }, { id: 's2', label: '拂袖' }, { id: 's3', label: '御剑' },
      { id: 's4', label: '炼丹' }, { id: 's5', label: '结印' }, { id: 's6', label: '饮酒' },
      { id: 's7', label: '抚琴' },
    ],
    remarks: { '兄': '外门·医修', '剑': '本命剑契', '姐': '墨家·机关', '尊': '清虚峰·主' },
    bg: '远山·楼阁瀑布',
    memberAvatars: {},
    crop: null,
    saved: false,
    drag: null,
  };

  bgMap = { '远山·楼阁瀑布': 'assets/bg/landscape-1.png', '江畔·飞鹤梅枝': 'assets/bg/landscape-2.png' };

  componentDidMount() { this.ensureHonglei(); }
  componentDidUpdate() { this.ensureHonglei(); }
  ensureHonglei() {
    if ((this.props.fontScheme ?? '霞鹜文楷·清隽') !== '鸿雷行书·潇洒' || this._hl) return;
    this._hl = true;
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://chinese-fonts-cdn.deno.dev/packages/hlxsjt/dist/%E9%B8%BF%E9%9B%B7%E8%A1%8C%E4%B9%A6%E7%AE%80%E4%BD%93/result.css';
    l.onerror = () => {};
    document.head.appendChild(l);
  }

  frameRef = React.createRef();

  _pt(e) { return e.touches ? e.touches[0] : e; }
  toFrame(cx, cy) {
    const el = this.frameRef.current;
    if (!el) return { x: cx, y: cy };
    const r = el.getBoundingClientRect();
    const scale = (r.width / el.offsetWidth) || 1;
    return { x: (cx - r.left) / scale, y: (cy - r.top) / scale };
  }
  isOver(y) {
    const el = this.frameRef.current;
    const h = el ? el.offsetHeight : 800;
    return y > h - 124;
  }
  pressStart = (e, id, label) => {
    if (this.state.drag) return;
    const p = this._pt(e);
    this._press = { id, label, sx: p.clientX, sy: p.clientY };
    clearTimeout(this._timer);
    this._timer = setTimeout(() => this.beginDrag(), 340);
    this._mv = (ev) => this.pressMove(ev);
    this._up = (ev) => this.pressUp(ev);
    window.addEventListener('mousemove', this._mv);
    window.addEventListener('mouseup', this._up);
    window.addEventListener('touchmove', this._mv, { passive: false });
    window.addEventListener('touchend', this._up);
  };
  beginDrag() {
    if (!this._press) return;
    const { id, label, sx, sy } = this._press;
    const pos = this.toFrame(sx, sy);
    this._dragging = true;
    this.setState({ drag: { id, label, x: pos.x, y: pos.y, over: this.isOver(pos.y) } });
  }
  pressMove(ev) {
    const p = this._pt(ev);
    if (this._dragging) {
      if (ev.cancelable) ev.preventDefault();
      const pos = this.toFrame(p.clientX, p.clientY);
      this.setState({ drag: { ...this.state.drag, x: pos.x, y: pos.y, over: this.isOver(pos.y) } });
    } else if (this._press) {
      const dx = p.clientX - this._press.sx, dy = p.clientY - this._press.sy;
      if (Math.hypot(dx, dy) > 12) { clearTimeout(this._timer); this._cleanupDrag(); }
    }
  }
  pressUp() {
    if (this._dragging && this.state.drag) {
      if (this.state.drag.over) this.deleteSticker(this.state.drag.id);
      this.setState({ drag: null });
    } else {
      clearTimeout(this._timer);
    }
    this._cleanupDrag();
  }
  _cleanupDrag() {
    this._dragging = false; this._press = null;
    window.removeEventListener('mousemove', this._mv);
    window.removeEventListener('mouseup', this._up);
    window.removeEventListener('touchmove', this._mv);
    window.removeEventListener('touchend', this._up);
  }

  deleteSticker(id) { this.setState((s) => ({ stickers: s.stickers.filter((x) => x.id !== id) })); }
  addSticker = () => { this.setState((s) => ({ stickers: [...s.stickers, { id: 's' + Date.now(), label: '新灵符' }] })); };

  setRemark(key, v) { this.setState((s) => ({ remarks: { ...s.remarks, [key]: v } })); }

  openCrop(key, name) {
    const a = this.state.memberAvatars[key];
    this.setState({ crop: { key, name, src: 'assets/bg/landscape-2.png', px: a ? a.px : 50, py: a ? a.py : 32, scale: a ? a.scale : 1.18 } });
  }
  onZoom = (e) => { const v = +e.target.value; this.setState((s) => ({ crop: { ...s.crop, scale: v } })); };
  onCropDown = (e) => {
    const p = e.touches ? e.touches[0] : e;
    const sx = p.clientX, sy = p.clientY;
    const c0 = this.state.crop;
    if (!c0) return;
    const spx = c0.px, spy = c0.py, k = 0.22 / (c0.scale || 1);
    const move = (ev) => {
      const q = ev.touches ? ev.touches[0] : ev;
      let nx = spx - (q.clientX - sx) * k, ny = spy - (q.clientY - sy) * k;
      nx = Math.max(0, Math.min(100, nx)); ny = Math.max(0, Math.min(100, ny));
      this.setState((s) => (s.crop ? { crop: { ...s.crop, px: nx, py: ny } } : null));
      if (ev.cancelable) ev.preventDefault();
    };
    const up = () => {
      window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up);
      window.removeEventListener('touchmove', move); window.removeEventListener('touchend', up);
    };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
    window.addEventListener('touchmove', move, { passive: false }); window.addEventListener('touchend', up);
  };
  confirmCrop = () => {
    const c = this.state.crop; if (!c) return;
    this.setState((s) => ({ memberAvatars: { ...s.memberAvatars, [c.key]: { src: c.src, px: c.px, py: c.py, scale: c.scale } }, crop: null }));
  };
  cancelCrop = () => { this.setState({ crop: null }); };
  onSave = () => { this.setState({ saved: true }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ saved: false }), 1700); };

  renderVals() {
    const shape = this.props.cropShape ?? '圆形';
    const cropRadius = shape === '方形' ? '14px' : shape === '圆角' ? '26%' : '50%';
    const sealName = this.props.sealColor ?? '朱砂红';
    const sealBg = sealName === '松烟墨' ? '#3a352d' : sealName === '石青' ? '#2f5d6b' : '#9a3b2c';
    const fontName = this.props.fontScheme ?? '思源宋·端方';
    const dispMap = {
      '思源宋·端方': "'Noto Serif SC', 'Songti SC', 'STSong', 'PingFang SC', -apple-system, serif",
      '思源黑·素雅': "'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif",
      '仿宋·清峻': "'FangSong', 'STFangsong', '仿宋', 'Noto Serif SC', 'PingFang SC', serif",
      '鸿雷行书·潇洒': "'鸿雷行书简体', 'Noto Serif SC', 'PingFang SC', -apple-system, serif",
    };
    const dispFont = dispMap[fontName] || dispMap['思源宋·端方'];
    const av = this.state.memberAvatars;

    const dragId = this.state.drag ? this.state.drag.id : null;
    const stickers = this.state.stickers.map((s) => ({
      id: s.id, label: s.label,
      op: dragId === s.id ? '.32' : '1',
      onPressStart: (e) => this.pressStart(e, s.id, s.label),
    }));

    const remarkMembers = this.membersBase.filter((m) => !m.self).map((m) => ({
      key: m.key, name: m.name, tag: m.tag, grad: m.grad, color: m.color,
      remark: this.state.remarks[m.key] || '',
      placeholder: '点此题写备注…',
      onRemark: (e) => this.setRemark(m.key, e.target.value),
    }));

    const avatarMembers = this.membersBase.map((m) => {
      const a = av[m.key];
      return {
        key: m.key, name: m.name, grad: m.grad, color: m.color,
        hasImg: !!a, noImg: !a,
        src: a ? a.src : '', px: a ? a.px : 50, py: a ? a.py : 50, scale: a ? a.scale : 1,
        onPick: () => this.openCrop(m.key, m.name),
      };
    });

    const bgOptions = Object.keys(this.bgMap).map((kk) => ({
      key: kk, label: kk.split('·')[0], sub: kk.split('·')[1], url: this.bgMap[kk],
      selected: this.state.bg === kk, onSelect: () => this.setState({ bg: kk }),
    }));

    const c = this.state.crop;
    return {
      bgUrl: this.bgMap[this.state.bg], bgDim: this.props.bgDim ?? 1, dispFont,
      cropRadius, sealBg,
      stickers, onAddSticker: this.addSticker,
      frameRef: this.frameRef,
      dragActive: !!this.state.drag,
      dragX: this.state.drag ? this.state.drag.x : 0,
      dragY: this.state.drag ? this.state.drag.y : 0,
      dragLabel: this.state.drag ? this.state.drag.label : '',
      trashWash: (this.state.drag && this.state.drag.over)
        ? 'radial-gradient(135% 92% at 50% 132%, rgba(198,46,28,.74) 0%, rgba(152,38,24,.34) 50%, rgba(152,38,24,0) 78%)'
        : 'linear-gradient(180deg, rgba(150,40,25,0) 0%, rgba(150,40,25,.09) 56%, rgba(150,40,25,.26) 100%)',
      trashIcon: (this.state.drag && this.state.drag.over) ? '#fff4ef' : 'rgba(178,70,50,.92)',
      trashSize: (this.state.drag && this.state.drag.over) ? '38' : '30',
      trashLabel: (this.state.drag && this.state.drag.over) ? '松手即焚' : '拖到此处焚去',
      remarkMembers, avatarMembers, bgOptions,
      cropOpen: !!c, cropMember: c ? c.name : '', cropSrc: c ? c.src : '',
      cropPx: c ? c.px : 50, cropPy: c ? c.py : 50, cropScale: c ? c.scale : 1,
      onCropDown: this.onCropDown, onZoom: this.onZoom, onCropCancel: this.cancelCrop, onCropConfirm: this.confirmCrop,
      savedA: this.state.saved && (this.props.saveAnim ?? '墨章·印') === '墨章·印',
      savedB: this.state.saved && (this.props.saveAnim ?? '墨章·印') === '笔锋·掠',
      onSave: this.onSave,
    };
  }
}
</script>
