<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<title>Forms — 祐识</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;background:var(--surface-canvas)}
  .wrap{padding:24px 26px;display:flex;flex-direction:column;gap:18px}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:12px;min-width:230px}
  .cols{display:flex;gap:28px;flex-wrap:wrap}
  .lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-bottom:2px}
</style>
</head><body class="paper-canvas">
<div id="root"></div>
<script type="text/babel">
const {Button,IconButton,Input,Checkbox}=window.DesignSystem_4278dc;
function Demo(){
  return (<div className="wrap">
    <div>
      <div className="lbl">Button — emphasis ladder (one loud action, the rest quiet)</div>
      <div className="row">
        <Button variant="solid" rightIcon="arrow-up">寄出</Button>
        <Button variant="outline" leftIcon="folder">选择</Button>
        <Button variant="soft">软按钮</Button>
        <Button variant="dashed" leftIcon="plus">再记一条</Button>
        <Button variant="tag">复购</Button>
        <Button variant="ghost" leftIcon="settings">设置</Button>
        <Button variant="text">查看全部</Button>
      </div>
      <div className="row" style={{marginTop:'10px'}}>
        <Button variant="text" tone="danger">先不了</Button>
        <Button variant="ghost" tone="danger" leftIcon="x">拒绝</Button>
        <Button variant="danger">删除</Button>
        <Button variant="solid" disabled>禁用</Button>
        <Button variant="solid" loading>保存中</Button>
      </div>
    </div>
    <div className="row" style={{gap:'28px'}}>
      <div>
        <div className="lbl">Sizes & pill</div>
        <div className="row">
          <Button size="sm" variant="outline">Small</Button>
          <Button size="md" variant="outline">Medium</Button>
          <Button size="lg" variant="outline">Large</Button>
          <Button variant="soft" pill size="sm">Pill</Button>
        </div>
      </div>
      <div>
        <div className="lbl">IconButton</div>
        <div className="row">
          <IconButton icon="arrow-up" label="发送" variant="primary"/>
          <IconButton icon="mic" label="语音" variant="ghost"/>
          <IconButton icon="plus" label="添加" variant="soft"/>
          <IconButton icon="settings" label="设置" variant="secondary" shape="square"/>
          <IconButton icon="search" label="搜索" variant="ghost" size="sm"/>
        </div>
      </div>
    </div>
    <div className="cols">
      <div className="col">
        <div className="lbl">Input</div>
        <Input leftIcon="search" placeholder="搜索任务…" size="sm"/>
        <Input label="项目名称" placeholder="给它起个名字" required/>
        <Input label="邮箱" error="请输入有效邮箱" defaultValue="hi@" size="sm"/>
      </div>
      <div className="col">
        <div className="lbl">Textarea & Checkbox</div>
        <Input multiline rows={2} placeholder="随心输入，一起写点什么吧~"/>
        <div className="row" style={{gap:'20px'}}>
          <Checkbox label="记住登录" defaultChecked/>
          <Checkbox shape="circle" label="做今日手账" strikeOnDone defaultChecked/>
          <Checkbox shape="circle" label="学习新技能"/>
        </div>
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
