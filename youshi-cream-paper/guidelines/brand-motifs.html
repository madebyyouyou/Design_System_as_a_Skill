<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-body)}
  .wrap{padding:22px 26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .b{display:flex;flex-direction:column;align-items:center;gap:10px}
  .cap{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-400)}
  img{display:block}
</style></head>
<body><div class="wrap">
  <div class="b"><img src="../assets/decorations/stars.svg" width="60" alt=""><span class="cap">stars</span></div>
  <div class="b"><img src="../assets/decorations/sparkle-cluster.svg" width="60" alt=""><span class="cap">sparkles</span></div>
  <div class="b"><img src="../assets/decorations/small-heart.svg" width="56" alt=""><span class="cap">heart</span></div>
  <div class="b"><img src="../assets/decorations/paperclip.svg" width="52" alt=""><span class="cap">paperclip</span></div>
</div></body></html>
