<!-- @dsCard group="Colors" viewport="700x180" name="Canvas base — cool ivory" subtitle="#F5F4EF page + neutral soft-light grain" -->
<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-body)}
  .wrap{padding:22px 26px;display:flex;gap:18px;align-items:center}
  .swatch{position:relative;overflow:hidden;width:220px;height:130px;border-radius:var(--radius-lg);border:1px solid var(--border-hair);background:var(--surface-canvas);box-shadow:var(--shadow-sm);display:flex;align-items:flex-end;padding:12px}
  .swatch::before{content:"";position:absolute;inset:0;background-image:var(--paper-grain);opacity:var(--paper-grain-opacity);mix-blend-mode:var(--paper-grain-blend)}
  .tag{position:relative;font-family:var(--font-mono);font-size:12px;color:var(--ink-500)}
  .note{font-size:13px;color:var(--text-muted);max-width:340px;line-height:1.6}
  code{font-family:var(--font-mono);font-size:12px;color:var(--sage-700);background:var(--sage-100);padding:1px 5px;border-radius:5px}
</style></head>
<body><div class="wrap">
  <div class="swatch"><span class="tag">#F5F4EF · --paper-page</span></div>
  <div class="note">The system page color — a <strong>cool ivory</strong> (<code>#F5F4EF</code>, <code>--paper-page</code>), only a whisper of warmth. A neutral-grey <strong>paper-grain</strong> noise composites with <code>soft-light</code> for texture only — it does not darken or tint the rendered page.</div>
</div></body></html>
