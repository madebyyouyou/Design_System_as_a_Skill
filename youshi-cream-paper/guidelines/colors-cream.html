<!-- @dsCard group="Colors" viewport="700x160" name="Cream — rice paper" subtitle="Cool-ivory neutral surfaces, lightest → paper edge" -->
<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-body)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:22px 24px}
  .sw{border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs);border:1px solid rgba(62,70,55,.08)}
  .chip{height:64px}
  .meta{padding:7px 8px;background:#fff}
  .tok{font-size:11px;font-weight:700;color:var(--ink-700)}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-400);text-transform:uppercase}
</style></head>
<body><div class="grid" id="g"></div>
<script>
const S=[['50','#FEFEFC'],['100','#FBFAF5'],['200','#F8F7F1'],['300','#F5F4EF'],['400','#EDEBE1'],['500','#E0DDD0'],['600','#CDC9BB']];
document.getElementById('g').innerHTML=S.map(([n,h])=>`<div class="sw"><div class="chip" style="background:${h}"></div><div class="meta"><div class="tok">cream-${n}</div><div class="hex">${h}</div></div></div>`).join('');
</script></body></html>
