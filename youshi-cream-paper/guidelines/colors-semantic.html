<!-- @dsCard group="Colors" viewport="700x210" name="Semantic roles" subtitle="Surfaces · text · states" -->
<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-body)}
  .wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-bottom:7px}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .sw{display:flex;align-items:center;gap:8px;padding:7px 11px 7px 8px;border-radius:var(--radius-pill);background:var(--surface-card-hi);border:1px solid var(--border-hair);box-shadow:var(--shadow-xs);font-size:12px;font-weight:600;color:var(--ink-700)}
  .dot{width:20px;height:20px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(62,70,55,.08)}
</style></head>
<body><div class="wrap">
  <div><div class="lbl">Surface & text</div><div class="row" id="s1"></div></div>
  <div><div class="lbl">States</div><div class="row" id="s2"></div></div>
</div>
<script>
const S1=[['canvas','var(--surface-canvas)'],['raised','var(--surface-raised)'],['card','var(--surface-card)'],['inset','var(--surface-inset)'],['text-body','var(--text-body)'],['text-muted','var(--text-muted)'],['brand','var(--brand)'],['accent-gold','var(--accent-gold)'],['accent-rose','var(--accent-rose)']];
const S2=[['success','var(--success)'],['warning','var(--warning)'],['danger','var(--danger)'],['info','var(--info)'],['focus-ring','var(--focus-ring)'],['border-dash','var(--border-dash)']];
const draw=(id,a)=>document.getElementById(id).innerHTML=a.map(([n,v])=>`<span class="sw"><span class="dot" style="background:${v}"></span>${n}</span>`).join('');
draw('s1',S1);draw('s2',S2);
</script></body></html>
