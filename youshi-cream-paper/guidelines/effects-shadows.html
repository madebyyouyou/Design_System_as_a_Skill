<!-- @dsCard group="Effects" viewport="700x200" name="Shadows — floating on paper" subtitle="Warm green-grey, shallow → deep" -->
<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-body)}
  .wrap{padding:26px 26px 30px;display:flex;gap:20px;flex-wrap:wrap}
  .b{display:flex;flex-direction:column;align-items:center;gap:12px}
  .box{width:96px;height:60px;background:var(--surface-card-hi);border-radius:var(--radius-lg);border:1px solid rgba(62,70,55,.05)}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--ink-500)}
</style></head>
<body><div class="wrap" id="g"></div>
<script>
const S=[['xs','var(--shadow-xs)'],['sm','var(--shadow-sm)'],['md','var(--shadow-md)'],['lg','var(--shadow-lg)'],['xl','var(--shadow-xl)']];
document.getElementById('g').innerHTML=S.map(([n,v])=>`<div class="b"><div class="box" style="box-shadow:${v}"></div><span class="tok">shadow-${n}</span></div>`).join('');
</script></body></html>
