<!-- @dsCard group="Spacing" viewport="700x180" name="Corner radii" subtitle="xs → 2xl · pill" -->
<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-body)}
  .wrap{padding:22px 26px;display:flex;gap:16px;flex-wrap:wrap}
  .b{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:74px;height:56px;background:var(--surface-card-hi);border:1.5px solid var(--sage-300);box-shadow:var(--shadow-sm)}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--ink-500)}
</style></head>
<body><div class="wrap" id="g"></div>
<script>
const R=[['xs','6px'],['sm','10px'],['md','14px'],['lg','18px'],['xl','24px'],['2xl','32px'],['pill','999px']];
document.getElementById('g').innerHTML=R.map(([n,v])=>`<div class="b"><div class="box" style="border-radius:${v}"></div><span class="tok">radius-${n}</span></div>`).join('');
</script></body></html>
