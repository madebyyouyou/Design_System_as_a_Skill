<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-body)}
  .wrap{padding:20px 26px;display:flex;flex-direction:column;gap:12px;max-width:620px}
  .r{display:flex;align-items:baseline;gap:14px}
  .m{font-family:var(--font-mono);font-size:11px;color:var(--ink-400);white-space:nowrap;flex:none;width:120px}

<body><div class="wrap">
  <div class="r"><span class="m">lg · 18</span><p style="font-size:18px">在宣纸上，把心里的话慢慢落成字句。</p></div>
  <div class="r"><span class="m">base · 15</span><p style="font-size:15px;line-height:1.5">正文默认字号。祐识的语气温柔、克制、带一点手账的松弛感——像给朋友写便签，而不是发通知。</p></div>
  <div class="r"><span class="m">sm · 13</span><p style="font-size:13px;color:var(--text-muted)">次要说明文字，用更淡的墨色。</p></div>
  <div class="r"><span class="m">xs · 12</span><p style="font-size:12px;color:var(--text-faint)">最小的辅助信息与时间戳。</p></div>
  <div class="r"><span class="m">eyebrow</span><p class="eyebrow">CREAM PAPER · YOUYOU</p></div>
