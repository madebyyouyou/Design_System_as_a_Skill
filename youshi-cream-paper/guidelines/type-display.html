<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-strong)}
  .wrap{padding:20px 26px;display:flex;flex-direction:column;gap:6px}
  .r{display:flex;align-items:baseline;gap:14px}
  .t{font-family:var(--font-display);font-weight:800;line-height:1.1;color:var(--ink-800)}
  .m{font-family:var(--font-mono);font-size:11px;color:var(--ink-400);white-space:nowrap}
</style></head>
<body><div class="wrap">
  <div class="r"><span class="t" style="font-size:48px">奶油宣纸</span><span class="m">4xl · 48 / 800</span></div>
  <div class="r"><span class="t" style="font-size:36px">今天想说点什么</span><span class="m">3xl · 36 / 800</span></div>
  <div class="r"><span class="t" style="font-size:28px;font-weight:700">Youyou Cream Paper</span><span class="m">2xl · 28 / 700</span></div>
  <div class="r"><span class="t" style="font-size:22px;font-weight:700">柔软而克制的界面</span><span class="m">xl · 22 / 700</span></div>
</div></body></html>
