<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-body)}
  .wrap{padding:22px 26px}
  pre{margin:0;font-family:var(--font-mono);font-size:13px;line-height:1.7;background:var(--surface-card-hi);border:1px solid var(--border-hair);border-radius:var(--radius-md);padding:14px 16px;color:var(--ink-700);box-shadow:var(--shadow-inset);overflow:auto}
  .k{color:var(--sage-600);font-weight:600}.s{color:var(--rose-600)}.c{color:var(--ink-400)}
</style></head>
<body><div class="wrap">
<pre><span class="c">// 祐识 · 奶油宣纸</span>
<span class="k">const</span> theme = { paper: <span class="s">'#F5F4EF'</span>, sage: <span class="s">'#8A9A6B'</span> };
<span class="k">export function</span> greet(name) {
  <span class="k">return</span> <span class="s">`欢迎回来，${name} ♡`</span>;
}</pre>
</div></body></html>
