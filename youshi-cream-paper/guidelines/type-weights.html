<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-body)}
  .wrap{padding:20px 26px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
  .w{font-size:24px;color:var(--ink-800)}
  .cap{font-family:var(--font-mono);font-size:10px;color:var(--ink-400);display:block;margin-top:2px}
</style></head>
<body><div class="wrap">
  <div class="row">
    <div><span class="w" style="font-weight:400">Youyou 祐识</span><span class="cap">400 regular</span></div>
    <div><span class="w" style="font-weight:500">Youyou 祐识</span><span class="cap">500 medium</span></div>
    <div><span class="w" style="font-weight:600">Youyou 祐识</span><span class="cap">600 semibold</span></div>
    <div><span class="w" style="font-weight:700">Youyou 祐识</span><span class="cap">700 bold</span></div>
    <div><span class="w" style="font-weight:800">Youyou 祐识</span><span class="cap">800 extrabold</span></div>
  </div>
  <div style="font-family:var(--font-cjk);font-size:16px;color:var(--ink-600)">奶油宣纸、低饱和、手绘线条、纸鹤与虚线——温柔而克制。<span class="cap" style="display:inline;margin-left:8px">Noto Sans SC</span></div>
</div></body></html>
