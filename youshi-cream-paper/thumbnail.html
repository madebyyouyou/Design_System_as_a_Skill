<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden;font-family:var(--font-display)}
  .main{flex:1;position:relative;background:var(--sage-500);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .cn{position:relative;font-size:230px;font-weight:800;color:var(--cream-50);line-height:.9;letter-spacing:.05em;text-shadow:0 6px 24px rgba(43,49,35,.18)}
  .en{position:relative;font-family:var(--font-hand);font-weight:600;font-size:80px;color:var(--sage-100)}
  .strip{width:300px;display:flex;flex-direction:column}
  .strip>div{flex:1}
</style></head>
<body><div class="tile">
  <div class="main">
    <div class="cn">祐识</div>
    <div class="en">奶油宣纸</div>
  </div>
  <div class="strip">
    <div style="background:#E3BFB9"></div>
    <div style="background:#C6B275"></div>
    <div style="background:#C58E86"></div>
    <div style="background:#3E4637"></div>
  </div>
</div></body></html>
